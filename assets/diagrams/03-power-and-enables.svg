<text x="80" y="802.16" font-family="Arial, sans-serif" font-size="23" fill="#173047">Assembly notes</text>
<text x="85" y="828.48" font-family="Arial, sans-serif" font-size="19" fill="#173047">+5V_LOGIC: regulated 5 V; USB-powered Uno 5 V output may feed driver logic only, within the USB current budget.</text>
<text x="85" y="864.48" font-family="Arial, sans-serif" font-size="19" fill="#173047">GND_RX joins Uno GND, RF receiver GND, motor supply negative, and L293D pins 4, 5, 12, 13.</text>
<text x="85" y="900.48" font-family="Arial, sans-serif" font-size="19" fill="#173047">Place bypass capacitors close to the driver. Add bulk capacitance appropriate to the motor supply and wiring.</text>
<text x="85" y="936.48" font-family="Arial, sans-serif" font-size="19" fill="#173047">Choose VMOTOR for the actual motors and driver limits. Do not power the motors from the Uno 5 V pin.</text>
<text x="85" y="972.48" font-family="Arial, sans-serif" font-size="19" fill="#173047">V_RF_RX is a separate module-rated rail unless its datasheet permits +5V_LOGIC. Never connect VMOTOR to VCC1.</text>
<polyline points="60,1015 1540,1015" fill="none" stroke="#d7e1e8" stroke-width="2"/>
<text x="60" y="1056.56" font-family="Arial, sans-serif" font-size="18" fill="#526779">HAND GESTURE CONTROLLED ROBOT  /  Reconstructed design · hardware validation pending</text>
<text x="60" y="1084.72" font-family="Arial, sans-serif" font-size="16" fill="#526779">Functional connection diagram: pin positions are symbolic. Named nets connect only within their own setup.</text>
