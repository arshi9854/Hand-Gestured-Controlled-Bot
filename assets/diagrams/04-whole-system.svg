<rect x="60" y="835" width="1480" height="155" rx="12" fill="#f7f9fb" stroke="#173047" stroke-width="2"/>
<text x="80" y="872.16" font-family="Arial, sans-serif" font-size="23" fill="#173047">Reading this diagram</text>
<text x="85" y="900.48" font-family="Arial, sans-serif" font-size="19" fill="#173047">Tilt selects a direction; transmitter sends it; receiver validates it; the driver energizes the two motors.</text>
<text x="85" y="932.48" font-family="Arial, sans-serif" font-size="19" fill="#173047">The RF link carries commands, not power. Actual module frequency, voltage, chassis and sensor mounting are provisional.</text>
<text x="85" y="964.48" font-family="Arial, sans-serif" font-size="19" fill="#173047">Illustration matches the repository architecture; it is not evidence of the original robot’s physical appearance.</text>
<polyline points="60,1015 1540,1015" fill="none" stroke="#d7e1e8" stroke-width="2"/>
<text x="60" y="1056.56" font-family="Arial, sans-serif" font-size="18" fill="#526779">HAND GESTURE CONTROLLED ROBOT  /  System illustrations · reconstructed reference design</text>
<text x="60" y="1084.72" font-family="Arial, sans-serif" font-size="16" fill="#526779">Illustrative snapshots, not photographs or measured results. Sensor mounting and motor direction require calibration.</text>
